<html lang="en">

<head>

  <title>Portfolio</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="For the past 5 years I've been building websites starting with the design and UX process, all the way to launch day. Along the way I've single-handedly scoped, built, and deployed over 25 sites for clients ranging from local businesses, to enterprise level corporations.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

    rel="stylesheet">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) { }
    })();
  </script>
</head>
