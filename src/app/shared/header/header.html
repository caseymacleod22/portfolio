<header class="site-header">
  <div class="site-header__bar">
    <a class="brand" routerLink="/" (click)="closeMenu()">Casey MacLeod</a>

    <div class="site-header__actions">
      <button
        type="button"
        class="theme-toggle"
        [attr.aria-pressed]="theme.isDark()"
        [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
        (click)="theme.toggle()"
      >
        @if (theme.isDark()) {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        }
      </button>

      <button
        type="button"
        class="menu-toggle"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="primary-nav"
        aria-label="Toggle navigation menu"
        (click)="toggleMenu()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <nav id="primary-nav" class="site-nav" [class.site-nav--open]="menuOpen()">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
    <a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()">Projects</a>
    <button type="button" class="site-nav__button" (click)="openContact()">Contact</button>
  </nav>
</header>

@if (contact.isOpen()) {
  <div class="contact-backdrop" (click)="contact.close()">
    <div
      class="contact-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="contact-modal-heading"
      (click)="$event.stopPropagation()"
    >
      <button #contactCloseButton type="button" class="contact-modal__close" aria-label="Close" (click)="contact.close()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>

      <h2 id="contact-modal-heading">Get in touch</h2>
      <ul class="contact-modal__list">
        <li>
          <a href="mailto:{{ email }}">
            <span class="contact-modal__label">Email</span>
            <span class="contact-modal__value">{{ email }}</span>
          </a>
        </li>
        <li>
          <a [href]="phoneHref">
            <span class="contact-modal__label">Phone</span>
            <span class="contact-modal__value">{{ phone }}</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
}
