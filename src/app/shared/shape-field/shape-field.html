@for (shape of shapes; track $index) {
  <div
    class="shape"
    [class.shape--desktop-only]="shape.desktopOnly"
    [style.left.%]="shape.x"
    [style.top.%]="shape.y"
    [style.width.px]="shape.size"
    [style.height.px]="shape.size"
    [style.color]="shape.color"
  >
    <div #shape class="shape__parallax">
      <svg
        class="shape__float"
        viewBox="0 0 24 24"
        [style.animation-duration.s]="shape.floatDuration"
        [style.animation-delay.s]="shape.floatDelay"
      >
        @switch (shape.kind) {
          @case ('circle') { <circle cx="12" cy="12" r="9" /> }
          @case ('square') { <rect x="4" y="4" width="16" height="16" rx="1" /> }
          @case ('diamond') { <path d="M12 2.5 21.5 12 12 21.5 2.5 12Z" /> }
          @case ('triangle') { <path d="M12 3.5 21 19.5H3Z" /> }
          @case ('cross') { <path d="M12 4v16M4 12h16" /> }
          @case ('hexagon') { <path d="M12 2.5 20.2 7.25v9.5L12 21.5l-8.2-4.75v-9.5Z" /> }
          @case ('zigzag') { <path d="M1.5 15 6.75 9l5.25 6 5.25-6 5.25 6" /> }
        }
      </svg>
    </div>
  </div>
}
